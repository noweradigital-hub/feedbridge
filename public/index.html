<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>FeedBridge</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- zvolený vzhľad ešte pred vykreslením, aby neprebliklo druhé farebné schéma -->
  <script>(function(){try{var t=localStorage.getItem('nwr-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}})();</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand"><img src="logo.png" alt="" width="28" height="28"><span>FeedBridge<small>Feedy pre Metu a Google</small></span></div>
    <div class="nav-label">Projekty</div>
    <nav id="project-list"></nav>
    <button id="new-project" class="btn primary wide">Nový projekt</button>
    <div class="side-foot">
      <div class="look" role="group" aria-label="Vzhľad"><button type="button" value="auto">Auto</button><button type="button" value="light">Svetlý</button><button type="button" value="dark">Tmavý</button></div>
    </div>
  </aside>
  <main id="main"><p class="muted pad">Načítavam…</p></main>
  <div id="toast" role="status"></div>
  <script>(function(){var root=document.documentElement,box=document.querySelector('.look');if(!box)return;
    function mark(){var t=root.dataset.theme||'auto';box.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',b.value===t);b.setAttribute('aria-pressed',b.value===t)})}
    box.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var t=b.value;
      if(t==='auto')delete root.dataset.theme;else root.dataset.theme=t;try{if(t==='auto')localStorage.removeItem('nwr-theme');else localStorage.setItem('nwr-theme',t)}catch(err){}mark()});mark()})();</script>
  <script src="app.js" type="module"></script>
</body>
</html>
